name: Test
on:
  pull_request:
  workflow_dispatch:

jobs:
  run_tests:
    name: Run Tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: models
            args: src/openpi/models
          - suite: library
            args: src --ignore=src/openpi/models
          - suite: scripts-and-client
            args: scripts packages
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest --strict-markers -m "not manual" -v ${{ matrix.args }}
