name: Test
on:
  pull_request:
  workflow_dispatch:

jobs:
  run_tests:
    name: Run Tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: models
            args: src/openpi/models
          - suite: library
            args: src --ignore=src/openpi/models
          - suite: scripts-and-client
            args: scripts packages --ignore=scripts/train_test.py
          - suite: training
            args: scripts/train_test.py --log-cli-level=INFO
    env:
      GIT_LFS_SKIP_SMUDGE: true
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev zsh

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run model tests
        if: matrix.suite == 'models'
        run: |
          uv run python -u - --strict-markers -m "not manual" -v ${{ matrix.args }} <<'PY'
          import os
          import sys

          import pytest

          # The hosted CPU job can hang during native interpreter shutdown after pytest finishes.
          result = pytest.main(sys.argv[1:])
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(int(result))
          PY

      - name: Run tests
        if: matrix.suite != 'models'
        run: uv run pytest --strict-markers -m "not manual" -v ${{ matrix.args }}
