name: ${OPENPI_COMPOSE_PROJECT_NAME:-openpi-dev}

services:
  openpi:
    image: ${OPENPI_DOCKER_IMAGE:-openpi:dev}
    build:
      context: .
      dockerfile: scripts/docker/dev.Dockerfile
      args:
        RUNTIME_UID: ${OPENPI_UID:-1000}
        RUNTIME_GID: ${OPENPI_GID:-1000}
        UBUNTU_APT_MIRROR: ${OPENPI_UBUNTU_APT_MIRROR:-https://archive.ubuntu.com/ubuntu}
        UBUNTU_SECURITY_MIRROR: ${OPENPI_UBUNTU_SECURITY_MIRROR:-https://security.ubuntu.com/ubuntu}
        UV_INDEX_URL: ${OPENPI_UV_INDEX_URL:-https://pypi.org/simple}
        UV_HTTP_TIMEOUT: ${OPENPI_UV_HTTP_TIMEOUT:-300}
        OPENPI_UV_SYNC_ATTEMPTS: ${OPENPI_UV_SYNC_ATTEMPTS:-3}
        OPENPI_UV_RETRY_DELAY_SECONDS: ${OPENPI_UV_RETRY_DELAY_SECONDS:-5}
    init: true
    stdin_open: true
    tty: true
    user: "${OPENPI_UID:-1000}:${OPENPI_GID:-1000}"
    working_dir: /workspace
    command: ["sleep", "infinity"]
    ports:
      - "${OPENPI_POLICY_PORT:-8000}:8000"
    environment:
      HOME: /home/openpi
      HF_HOME: /home/openpi/.cache/huggingface
      IS_DOCKER: "true"
      OPENPI_DATA_HOME: /home/openpi/.cache/openpi
      PYTHONPATH: /workspace/src:/workspace/packages/openpi-client/src
      UV_PROJECT_ENVIRONMENT: /.venv
      WANDB_DIR: /workspace/wandb
      XDG_CACHE_HOME: /home/openpi/.cache
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${OPENPI_DOCKER_DATA_DIR:-../openpi-docker-data}/cache
        target: /home/openpi/.cache
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENPI_DOCKER_DATA_DIR:-../openpi-docker-data}/assets
        target: /workspace/assets
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENPI_DOCKER_DATA_DIR:-../openpi-docker-data}/checkpoints
        target: /workspace/checkpoints
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENPI_DOCKER_DATA_DIR:-../openpi-docker-data}/data
        target: /workspace/data
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENPI_DOCKER_DATA_DIR:-../openpi-docker-data}/wandb
        target: /workspace/wandb
        bind:
          create_host_path: true
